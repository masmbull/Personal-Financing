{% extends "base.html" %}
{% block title %}Edit Aset{% endblock %}
{% block content %}
<div class="page">
    <header class="page-header">
        <h1 class="page-title">Edit Aset</h1>
    </header>
    <form method="post" action="/assets/edit/{{ asset.id }}" class="form">
        <div class="form-group">
            <label class="form-label">Nama Aset</label>
            <input type="text" name="name" class="form-input" required value="{{ asset.name }}">
        </div>
        <div class="form-group">
            <label class="form-label">Tipe Aset</label>
            <select name="asset_type" class="form-input" required>
                {% for t in ASSET_TYPES %}
                <option value="{{ t }}" {% if asset.asset_type == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Nilai Saat Ini (Rp)</label>
            <input type="number" name="current_value" class="form-input" required min="0" value="{{ asset.current_value }}">
        </div>
        <div class="form-group">
            <label class="form-label">Harga Beli (Rp)</label>
            <input type="number" name="purchase_value" class="form-input" min="0" value="{{ asset.purchase_value or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Tanggal Beli</label>
            <input type="date" name="purchase_date" class="form-input" value="{{ asset.purchase_date.isoformat() if asset.purchase_date else today }}">
        </div>
        <div class="form-group">
            <label class="form-label">Icon (emoji)</label>
            <input type="text" name="icon" class="form-input" value="{{ asset.icon or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Catatan</label>
            <textarea name="notes" class="form-input" rows="2">{{ asset.notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Simpan</button>
        <a href="/assets" class="btn btn-block mt-xs d-block">Batal</a>
    </form>
</div>
{% endblock %}
