{% extends "base.html" %}
{% block title %}Edit Kategori{% endblock %}
{% block content %}
<div class="page">
    <header class="page-header">
        <h1 class="page-title">Edit Kategori</h1>
    </header>

    <form method="post" action="/categories/edit/{{ category.id }}" class="form">
        <div class="form-group">
            <label class="form-label" for="name">Nama</label>
            <input type="text" name="name" id="name" class="input" value="{{ category.name }}" required maxlength="100">
        </div>

        <div class="form-group">
            <label class="form-label" for="type">Tipe</label>
            <select name="type" id="type" class="input" required>
                <option value="EXPENSE" {% if category.type.value == 'EXPENSE' %}selected{% endif %}>Pengeluaran</option>
                <option value="INCOME" {% if category.type.value == 'INCOME' %}selected{% endif %}>Pemasukan</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="icon">Icon (opsional)</label>
            <input type="text" name="icon" id="icon" class="input" value="{{ category.icon or '' }}" maxlength="5">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Simpan Perubahan</button>
    </form>
</div>
{% endblock %}
