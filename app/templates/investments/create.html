{% extends "base.html" %}
{% block title %}Tambah Investasi{% endblock %}
{% block content %}
<div class="page">
    <header class="page-header">
        <h1 class="page-title">Tambah Investasi</h1>
    </header>
    <form method="post" action="/investments/create" class="form">
        <div class="form-group">
            <label class="form-label">Nama Investasi</label>
            <input type="text" name="name" class="form-input" required placeholder="Contoh: BBCA, Indomie Saham, Emas Antam">
        </div>
        <div class="form-group">
            <label class="form-label">Tipe Investasi</label>
            <select name="investment_type" class="form-input" required>
                {% for t in INVESTMENT_TYPES %}
                <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Jumlah Investasi (Rp)</label>
            <input type="number" name="amount_invested" class="form-input" required min="1" placeholder="0">
        </div>
        <div class="form-group">
            <label class="form-label">Nilai Saat Ini (Rp)</label>
            <input type="number" name="current_value" class="form-input" required min="0" placeholder="0">
        </div>
        <div class="form-group">
            <label class="form-label">Tanggal Beli</label>
            <input type="date" name="purchase_date" class="form-input" value="{{ today }}">
        </div>
        <div class="form-group">
            <label class="form-label">Icon (emoji)</label>
            <input type="text" name="icon" class="form-input" placeholder="📈">
        </div>
        <div class="form-group">
            <label class="form-label">Catatan</label>
            <textarea name="notes" class="form-input" rows="2" placeholder="Catatan tambahan"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Simpan</button>
        <a href="/investments" class="btn btn-block mt-xs d-block">Batal</a>
    </form>
</div>
{% endblock %}
