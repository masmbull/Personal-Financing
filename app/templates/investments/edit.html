{% extends "base.html" %}
{% block title %}Edit Investasi{% endblock %}
{% block content %}
<div class="page">
    <header class="page-header">
        <h1 class="page-title">Edit Investasi</h1>
    </header>
    <form method="post" action="/investments/edit/{{ inv.id }}" class="form">
        <div class="form-group">
            <label class="form-label">Nama Investasi</label>
            <input type="text" name="name" class="form-input" required value="{{ inv.name }}">
        </div>
        <div class="form-group">
            <label class="form-label">Tipe Investasi</label>
            <select name="investment_type" class="form-input" required>
                {% for t in INVESTMENT_TYPES %}
                <option value="{{ t }}" {% if inv.investment_type == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Jumlah Investasi (Rp)</label>
            <input type="number" name="amount_invested" class="form-input" required min="1" value="{{ inv.amount_invested }}">
        </div>
        <div class="form-group">
            <label class="form-label">Nilai Saat Ini (Rp)</label>
            <input type="number" name="current_value" class="form-input" required min="0" value="{{ inv.current_value }}">
        </div>
        <div class="form-group">
            <label class="form-label">Tanggal Beli</label>
            <input type="date" name="purchase_date" class="form-input" value="{{ inv.purchase_date.isoformat() if inv.purchase_date else today }}">
        </div>
        <div class="form-group">
            <label class="form-label">Icon (emoji)</label>
            <input type="text" name="icon" class="form-input" value="{{ inv.icon or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Catatan</label>
            <textarea name="notes" class="form-input" rows="2">{{ inv.notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Simpan</button>
        <a href="/investments" class="btn btn-block" style="margin-top:8px;">Batal</a>
    </form>
</div>
{% endblock %}
