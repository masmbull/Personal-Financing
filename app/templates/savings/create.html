{% extends "base.html" %}
{% block title %}Tambah Target Tabungan{% endblock %}
{% block content %}
<div class="page">
    <header class="page-header">
        <h1 class="page-title">Tambah Target Tabungan</h1>
    </header>
    <form method="post" action="/savings/create" class="form">
        <div class="form-group">
            <label class="form-label">Nama Target</label>
            <input type="text" name="name" class="form-input" required placeholder="Contoh: Beli Laptop, Liburan, etc">
        </div>
        <div class="form-group">
            <label class="form-label">Target Jumlah (Rp)</label>
            <input type="number" name="target_amount" class="form-input" required min="1" placeholder="0">
        </div>
        <div class="form-group">
            <label class="form-label">Icon (emoji)</label>
            <input type="text" name="icon" class="form-input" placeholder="🎯">
        </div>
        <div class="form-group">
            <label class="form-label">Catatan</label>
            <textarea name="notes" class="form-input" rows="2" placeholder="Catatan tambahan"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Simpan</button>
        <a href="/savings" class="btn btn-block mt-xs d-block">Batal</a>
    </form>
</div>
{% endblock %}
