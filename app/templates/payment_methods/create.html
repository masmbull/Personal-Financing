{% extends "base.html" %}
{% block title %}Tambah Metode Pembayaran{% endblock %}
{% block content %}
<div class="page">
    <header class="page-header">
        <h1 class="page-title">Tambah Metode</h1>
    </header>

    <form method="post" action="/payment-methods/create" class="form">
        <div class="form-group">
            <label class="form-label" for="name">Nama</label>
            <input type="text" name="name" id="name" class="input" placeholder="Contoh: GoPay" required maxlength="100">
        </div>

        <div class="form-group">
            <label class="form-label" for="method_type">Tipe</label>
            <select name="method_type" id="method_type" class="input" required>
                {% for t in PaymentMethodType %}
                <option value="{{ t.value }}">{{ t.value }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Simpan Metode</button>
    </form>
</div>
{% endblock %}
