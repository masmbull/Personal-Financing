{% extends "base.html" %}
{% block title %}Daftar - Finance{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-head">
            <div class="auth-logo" aria-hidden="true">💰</div>
            <h1 class="auth-title">Buat Akun</h1>
            <p class="auth-sub">Data keuanganmu terpisah dari pengguna lain</p>
        </div>

        {% if error %}
        <div class="auth-error" role="alert">Pendaftaran tidak berhasil. Cek username dan password (min. 8 karakter).</div>
        {% endif %}

        <form method="post" action="/register" class="form auth-form" id="register-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" name="username" id="username" class="input"
                       placeholder="username" required autocomplete="username"
                       autofocus maxlength="50" minlength="3">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="input"
                       placeholder="min. 8 karakter" required autocomplete="new-password" minlength="8">
            </div>

            <div class="form-group">
                <label class="form-label" for="password2">Ulangi Password</label>
                <input type="password" name="password2" id="password2" class="input"
                       required autocomplete="new-password" minlength="8">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span>Daftar</span>
                <span class="btn-spinner hidden" aria-hidden="true"></span>
            </button>
        </form>

        <p class="auth-alt">Sudah punya akun? <a href="/login" class="link-more">Masuk</a></p>
    </div>
</div>

<script>
(function () {
    var form = document.getElementById('register-form');
    if (!form) return;
    form.addEventListener('submit', function () {
        var a = form.querySelector('#password').value;
        var b = form.querySelector('#password2').value;
        if (a !== b) {
            alert('Password tidak sama.');
            return;
        }
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.classList.add('btn-loading');
        btn.querySelector('.btn-spinner').classList.remove('hidden');
    });
})();
</script>
{% endblock %}
