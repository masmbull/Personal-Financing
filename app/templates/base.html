<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>{% block title %}Finance{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
    <div class="toast-container" id="toast-container"></div>

    <main class="main-content page-enter page-enter-active">
        {% if request.state.user %}
        <div class="auth-bar">
            <span class="auth-user">👤 {{ request.state.user.username }}</span>
            <form method="post" action="/logout" class="inline">
                <button type="submit" class="auth-logout">Keluar</button>
            </form>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% if request.state.user %}
    <nav class="bottom-nav" aria-label="Navigasi utama">
        <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Beranda</span>
        </a>
        <a href="/transactions" class="nav-item {% if '/transactions' in request.url.path and '/edit' not in request.url.path %}active{% endif %}">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Transaksi</span>
        </a>
        <a href="/receipts/upload" class="nav-item nav-add" aria-label="Scan Struk" title="Scan Struk">
            <span class="nav-icon-add" aria-hidden="true">＋</span>
            <span class="nav-label">Scan</span>
        </a>
        <a href="/reports" class="nav-item {% if '/reports' in request.url.path %}active{% endif %}">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Laporan</span>
        </a>
        <a href="/more" class="nav-item {% if '/more' in request.url.path or '/accounts' in request.url.path or '/debts' in request.url.path or '/bills' in request.url.path or '/budgets' in request.url.path or '/savings' in request.url.path or '/assets' in request.url.path or '/investments' in request.url.path or '/categories' in request.url.path or '/receipts' in request.url.path and '/receipts/upload' not in request.url.path %}active{% endif %}">
            <span class="nav-icon">⋯</span>
            <span class="nav-label">Lainnya</span>
        </a>
    </nav>
    {% endif %}

    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" id="modalClose" aria-label="Tutup">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
    (function(){
      var mo = document.getElementById('modalOverlay');
      var mc = document.getElementById('modalClose');
      var hide = function(){ if(mo){mo.classList.remove('show')} };
      if(mo) mo.addEventListener('click', function(e){ if(e.target===mo) hide(); });
      if(mc) mc.addEventListener('click', hide);
      document.addEventListener('keydown', function(e){ if(e.key==='Escape') hide(); });
    })();
    </script>
</body>
</html>
