name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite
        env:
          APP_ENV: test
          RECEIPT_AI_BASE_URL: http://127.0.0.1:11435/v1
          RECEIPT_AI_TIMEOUT_SEC: '1'
        run: python -m pytest tests/ -q --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: standarbengkel
          username: standarbengkel
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -e
            echo "=== Trust repo dir ==="
            git config --global --add safe.directory /opt/finance

            echo "=== Pull latest code ==="
            cd /opt/finance
            git fetch origin main
            git reset --hard origin/main

            echo "=== Update deps ==="
            source venv/bin/activate
            pip install --quiet -r requirements.txt

            echo "=== Restart service ==="
            sudo systemctl restart finance

            echo "=== Health check ==="
            # Probe the canonical unauthenticated health endpoint rather than
            # `/` (which 303-redirects to /login when called without a session
            # cookie, as the auth dep rejects it). uvicorn 0.30 binds the
            # socket only AFTER the lifespan startup completes, so poll up
            # to ~60s; on final failure dump the journal so real crashes
            # surface in the Actions log.
            ok=0
            for i in $(seq 1 30); do
              if systemctl is-active --quiet finance; then
                code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:8000/api/v1/health 2>/dev/null || echo "000")
                if [ "$code" = "200" ]; then
                  echo "✅ HTTP 200 on /api/v1/health (attempt $i)"
                  ok=1
                  break
                fi
                echo "...waiting (attempt $i, http=$code)"
              else
                echo "...service not active yet (attempt $i)"
              fi
              sleep 2
            done

            if [ "$ok" = "1" ]; then
              echo "=== DEPLOY OK $(date) ==="
            else
              echo "❌ Health check failed after retries"
              echo "--- last 60 finance log lines ---"
              sudo journalctl -u finance -n 60 --no-pager
              exit 1
            fi