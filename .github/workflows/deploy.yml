name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: standarbengkel
          username: standarbengkel
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -e
            echo "=== Trust repo dir ==="
            git config --global --add safe.directory /opt/finance

            echo "=== Pull latest code ==="
            cd /opt/finance
            git fetch origin main
            git reset --hard origin/main

            echo "=== Update deps ==="
            source venv/bin/activate
            pip install --quiet -r requirements.txt

            echo "=== Restart service ==="
            sudo systemctl restart finance
            sleep 3

            echo "=== Health check ==="
            if systemctl is-active --quiet finance; then
              echo "✅ finance service: ACTIVE"
            else
              echo "❌ finance service: DOWN"
              sudo journalctl -u finance -n 20 --no-pager
              exit 1
            fi

            code=$(curl -fsSL -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "000")
            if [ "$code" = "200" ]; then
              echo "✅ HTTP 200 on localhost:8000"
            else
              echo "❌ HTTP $code"
              exit 1
            fi

            echo "=== DEPLOY OK $(date) ==="